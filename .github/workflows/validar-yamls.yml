name: Validar entregas
on:
  pull_request:
    paths:
      - "**.yaml"
      - "**.yml"
      - "**.py"
      - "**.js"
      - "**.json"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "**.yaml"
      - "**.yml"
      - "**.py"
      - "**.js"
      - "**.json"
      - ".github/workflows/**"
permissions:
  contents: read
jobs:
  manifests:
    name: Manifests (schema + regras da casa)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Baixar kubeconform
        run: |
          curl -sSLo kc.tar.gz "https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz"
          tar -xf kc.tar.gz kubeconform
          chmod +x kubeconform
      - name: Validar manifests (chamados + workload)
        run: |
          ./kubeconform -strict -summary -ignore-missing-schemas \
            ticket-02-triagem-no-cluster/chamados/ \
            ticket-01-padrao-de-manifests/execucao/modo-escrita/
      - name: Regras da casa (script da skill do Ticket 01)
        run: |
          python3 ticket-01-padrao-de-manifests/skill/scripts/validar_padrao.py \
            ticket-01-padrao-de-manifests/execucao/modo-escrita/kube-news
          python3 ticket-01-padrao-de-manifests/skill/scripts/validar_padrao.py \
            ticket-01-padrao-de-manifests/execucao/modo-escrita/fake-shop
      - name: Manifesto barrado DEVE reprovar (teste negativo)
        run: python3 ticket-01-padrao-de-manifests/tests/test_validador.py
  ferramentas:
    name: metavm (contrato + idempotência)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências do metavm
        run: pip install pyyaml
      - name: Verificar contrato, 11 regras e idempotência
        run: |
          python3 - <<'PY'
          import ast, importlib.util, json, sys
          src = open('ticket-03-inventario-de-vm/metavm.py', encoding='utf-8').read()
          ast.parse(src)
          spec = importlib.util.spec_from_file_location('metavm', 'ticket-03-inventario-de-vm/metavm.py')
          m = importlib.util.module_from_spec(spec)
          sys.modules['metavm'] = m  # dataclass resolve o tipo pelo módulo registrado
          spec.loader.exec_module(m)
          assert len(m.BASELINE) == 11, f'baseline deveria ter 11 regras, tem {len(m.BASELINE)}'
          for ex in ('exec1', 'exec2'):
              d = json.load(open(f'ticket-03-inventario-de-vm/evidencia/{ex}/laudo.json'))
              assert set(d) == {'host', 'inventario', 'conformidade', 'resumo'}, (ex, list(d))
              assert len(d['conformidade']) == 11, (ex, len(d['conformidade']))
              for c in d['conformidade']:
                  assert c['veredito'] in ('conforme', 'desvio', 'nao_verificado'), c
                  assert c['encontrado'] not in ('conforme', 'desvio', 'nao_verificado'), ('encontrado com veredito', c)
                  if c['veredito'] == 'nao_verificado':
                      assert c.get('motivo'), ('nao_verificado sem motivo', c)
              r = d['resumo']
              assert r['conforme'] + r['desvio'] + r['nao_verificado'] == 11, r
          a = json.load(open('ticket-03-inventario-de-vm/evidencia/exec1/laudo.json'))
          b = json.load(open('ticket-03-inventario-de-vm/evidencia/exec2/laudo.json'))
          a['host']['coletado_em'] = b['host']['coletado_em'] = '<ts>'
          assert json.dumps(a, sort_keys=True) == json.dumps(b, sort_keys=True), 'exec1 e exec2 divergem'
          print('metavm: 11 regras, contrato OK, idempotência OK')
          PY
  painel:
    name: Painel (somente leitura)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependências
        working-directory: ticket-04-dashboard-do-cluster/painel-parque
        run: npm install --no-audit --no-fund
      - name: Sintaxe do servidor
        working-directory: ticket-04-dashboard-do-cluster/painel-parque
        run: node --check src/servidor.js
      - name: Garantia de leitura (nenhuma chamada de escrita)
        working-directory: ticket-04-dashboard-do-cluster/painel-parque
        run: npm run verificar-leitura
      - name: Contrato das capturas versionadas
        run: |
          python3 - <<'PY'
          import json
          esperado = {
              'cenario1-inacessivel.json': 'cluster-indisponivel',
              'cenario2-token-expirado.json': 'credencial-expirada',
              'cenario3-acesso-negado.json': 'acesso-negado',
          }
          base = 'ticket-04-dashboard-do-cluster/painel-parque/evidencia/'
          for nome, codigo in esperado.items():
              d = json.load(open(base + nome))
              erros = d.get('erros') or []
              assert erros, f'{nome}: deveria trazer erro'
              assert erros[0]['codigo'] == codigo, (nome, erros[0])
              print(f'  {nome}: {codigo} OK')
          for nome in ('overview-nyx-prod.json', 'overview-nyx-dev.json', 'overview-orion-dev.json'):
              d = json.load(open(base + nome))
              assert d['pods'], f'{nome}: sem pods'
              print(f"  {nome}: {len(d['pods'])} pods OK")
          PY
