# Kube-news (nyx) — Service. port 80 → targetPort 8080 (porta real da app).
apiVersion: v1
kind: Service
metadata:
  name: kube-news
  namespace: nyx-dev
  labels:
    app.kubernetes.io/name: kube-news
    app.kubernetes.io/instance: nyx-dev
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: plataforma-nyx
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kube-news
    app.kubernetes.io/instance: nyx-dev
  ports:
    - name: http
      port: 80
      targetPort: 8080
