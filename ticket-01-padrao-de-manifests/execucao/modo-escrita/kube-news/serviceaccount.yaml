# Kube-news (nyx) — ServiceAccount dedicada, sem token da API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-news
  namespace: nyx-dev
  labels:
    app.kubernetes.io/name: kube-news
    app.kubernetes.io/instance: nyx-dev
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: plataforma-nyx
automountServiceAccountToken: false
