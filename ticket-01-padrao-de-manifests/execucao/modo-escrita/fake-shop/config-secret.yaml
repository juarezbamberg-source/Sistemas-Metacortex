# Fake-shop (orion) — ConfigMap (não sensível) e Secret (placeholder base64;
# o valor real — a senha do banco — é aplicado fora do Git, regra 3.3).
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-shop
  namespace: orion-dev
  labels:
    app.kubernetes.io/name: fake-shop
    app.kubernetes.io/instance: orion-dev
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: plataforma-orion
data:
  db_host: fake-shop-postgres
  db_name: ecommerce
  db_user: ecommerce
