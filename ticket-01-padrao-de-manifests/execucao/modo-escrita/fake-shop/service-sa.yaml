# Fake-shop (cliente orion) — Service e ServiceAccount.
apiVersion: v1
kind: Service
metadata:
  name: fake-shop
  namespace: orion-dev
  labels:
    app.kubernetes.io/name: fake-shop
    app.kubernetes.io/instance: orion-dev
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: plataforma-orion
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fake-shop
    app.kubernetes.io/instance: orion-dev
  ports:
    - name: http
      port: 80
      targetPort: 5000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fake-shop
  namespace: orion-dev
  labels:
    app.kubernetes.io/name: fake-shop
    app.kubernetes.io/instance: orion-dev
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: plataforma-orion
automountServiceAccountToken: false
